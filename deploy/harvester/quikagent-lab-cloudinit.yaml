apiVersion: v1
kind: Secret
metadata:
  name: quikagent-lab-cloudinit
  namespace: default
  labels:
    harvesterhci.io/cloud-init-template: user
type: Opaque
stringData:
  networkdata: ""
  userdata: |
    #cloud-config
    hostname: quikagent-lab
    manage_etc_hosts: true
    users:
      - default
      - name: ubuntu
        groups: [sudo]
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        ssh_authorized_keys:
          - ssh-ed25519 REPLACE_WITH_SSH_PUBKEY
    ssh_authorized_keys:
      - ssh-ed25519 REPLACE_WITH_SSH_PUBKEY
    package_update: true
    packages:
      - qemu-guest-agent
      - git
      - tmux
      - curl
      - ca-certificates
      - build-essential
    write_files:
      - path: /usr/local/bin/quikagent-install-go.sh
        permissions: "0755"
        owner: root:root
        content: |
          #!/bin/bash
          set -euo pipefail
          GO_VERSION=1.27.0
          ARCH=$(dpkg --print-architecture)
          case "$ARCH" in
            amd64) GOARCH=amd64 ;;
            arm64) GOARCH=arm64 ;;
            *) echo "unsupported arch: $ARCH"; exit 1 ;;
          esac
          if command -v go >/dev/null 2>&1; then
            cur=$(go env GOVERSION 2>/dev/null || true)
            if [ "$cur" = "go${GO_VERSION}" ] || [ "$cur" = "${GO_VERSION}" ]; then
              exit 0
            fi
          fi
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${GOARCH}.tar.gz" -o /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          rm -f /tmp/go.tgz
          ln -sfn /usr/local/go/bin/go /usr/local/bin/go
          ln -sfn /usr/local/go/bin/gofmt /usr/local/bin/gofmt
    runcmd:
      - [systemctl, enable, --now, qemu-guest-agent]
      - [/usr/local/bin/quikagent-install-go.sh]
      - [mkdir, -p, /home/ubuntu/.ssh, /home/ubuntu/src, /home/ubuntu/.quikagent]
      - [chown, -R, ubuntu:ubuntu, /home/ubuntu/.ssh, /home/ubuntu/src, /home/ubuntu/.quikagent]
      - [chmod, "700", /home/ubuntu/.ssh]
